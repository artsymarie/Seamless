<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Artsy Sign Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: sign list | the sign on a dark wall with its timeline | spritesheet, checks, exports and copy */
:root{
  --void:#000000;
  --panel:#0b0b0b;
  --raise:#161616;
  --line:#272727;
  --line-2:#3c3c3c;
  --ink:#f4f4f2;
  --ink-2:#ababa7;
  --ink-3:#75756f;
  --ok:#c6f0d0;
  --warn:#ffc47d;
  --wall:#121212;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:14px/1.45 var(--display)}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 344px;grid-template-rows:auto minmax(0,1fr);height:100%;min-height:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px 20px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.brand img{height:30px;width:auto;display:block}
.brand b{font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);padding-left:14px;border-left:1px solid var(--line-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:9px 12px;font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;border-left:1px solid var(--line-2);display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.seg label:first-of-type{border-left:0}
.seg label small{font-weight:400;color:var(--ink-3);letter-spacing:.04em}
.seg input:checked+label{background:var(--ink);color:var(--void)}
.seg input:checked+label small{color:#444}
.seg input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.seg label:hover{color:var(--ink)}

nav.signs{border-right:1px solid var(--line);overflow:auto;padding:16px 0 24px;min-height:0}
.navh{font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:0 16px 10px}
.navh:not(:first-child){padding-top:18px}
.signs ol{list-style:none;margin:0;padding:0}
.signs li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr;gap:2px 8px;width:100%;padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
.signs li button:hover{background:var(--raise)}
.signs li button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.signs li button[aria-current="true"]{background:var(--ink);color:var(--void);border-left-color:var(--ink)}
.signs li button[aria-current="true"] .k,.signs li button[aria-current="true"] small{color:#444}
.signs .k{font:700 11px/1.5 var(--mono);color:var(--ink-3);grid-row:span 2}
.signs strong{font:800 15px/1.2 var(--display);font-stretch:112.5%;text-transform:uppercase;letter-spacing:.01em}
.signs small{font:400 11px/1.3 var(--mono);color:var(--ink-3)}

main.stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.wall{flex:1 0 auto;display:grid;place-items:center;padding:28px 16px;min-height:340px;background:radial-gradient(120% 90% at 50% 40%,#1b1b1b 0%,var(--wall) 55%,#070707 100%)}
.wall canvas{display:block;max-width:100%;max-height:min(60vh,720px);width:auto;height:auto;box-shadow:0 0 0 1px #2a2a2a,0 30px 80px -30px rgba(0,0,0,.9)}
.transport{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 13px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.solid{background:var(--ink);color:var(--void);border-color:var(--ink)}
.btn.solid:hover{background:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.clock{font:400 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.hint{font:400 12px/1.5 var(--mono);color:var(--ink-3)}
.timeline{list-style:none;margin:0;padding:4px 16px 18px;display:flex;gap:10px;overflow-x:auto}
.timeline li{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
.timeline .thumb{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;outline:1px solid var(--line-2)}
.timeline .thumb canvas{display:block;height:76px;width:auto}
.timeline .thumb span{position:absolute;left:0;top:0;font:700 10px/1 var(--mono);background:var(--ink);color:var(--void);padding:3px 4px}
.timeline .thumb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.timeline li.on .thumb{outline:2px solid var(--ink);outline-offset:2px}
.timeline label{display:flex;align-items:center;gap:3px;font:400 11px/1 var(--mono);color:var(--ink-3)}
.timeline input[type=number]{width:58px;background:var(--raise);border:1px solid var(--line-2);padding:4px 5px;font:400 11px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.extras{padding:4px 16px 18px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.field input[type=number]{width:90px}
input[type=text],input[type=number],select,textarea{background:var(--raise);border:1px solid var(--line-2);padding:8px 9px;font:400 13px/1.3 var(--display);color:var(--ink);border-radius:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:0}

aside.side{border-left:1px solid var(--line);overflow:auto;min-height:0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:22px}
aside h2{margin:0;font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
section.p{display:flex;flex-direction:column;gap:12px;min-width:0}
.sheetbox{background:var(--wall);border:1px solid var(--line);padding:10px;display:grid;place-items:center}
.sheetbox canvas{display:block;max-width:100%;height:auto}
dl.spec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:400 12px/1.35 var(--mono);font-variant-numeric:tabular-nums}
dl.spec dt{color:var(--ink-3)}
dl.spec dd{margin:0;color:var(--ink);min-width:0}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font:400 12px/1.35 var(--mono)}
ul.checks li{display:grid;grid-template-columns:18px 1fr;gap:6px}
ul.checks li::before{content:"✓";color:var(--ok);font-weight:700}
ul.checks li.bad::before{content:"!";color:var(--warn)}
ul.checks li.bad{color:var(--warn)}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .wide{grid-column:1/-1}
form.copy{display:flex;flex-direction:column;gap:12px}
form.copy label{display:flex;flex-direction:column;gap:5px;font:700 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
form.copy label em{font:400 11px/1.35 var(--mono);letter-spacing:0;text-transform:none;font-style:normal;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--void);font:700 12px/1.3 var(--mono);padding:10px 14px;max-width:calc(100% - 32px);z-index:5}
.loading{font:400 12px/1.5 var(--mono);color:var(--ink-3)}

@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto auto auto}
  aside.side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
  .app{height:auto}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.signs{border-right:0;border-bottom:1px solid var(--line);padding:12px 0}
  .signs ol{display:flex;overflow-x:auto}
  .signs li button{width:auto;min-width:150px;border-left:0;border-bottom:3px solid transparent}
  .navh{display:none}
  .wall{min-height:300px;padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img id="brandLogo" alt="artsy"><b>Sign Studio</b></div>
    <div class="seg" id="fmtSeg" role="radiogroup" aria-label="Sign format">
      <input type="radio" name="fmt" id="fmt-portrait" value="portrait" checked><label for="fmt-portrait">Portrait <small>1:2</small></label>
      <input type="radio" name="fmt" id="fmt-landscape" value="landscape"><label for="fmt-landscape">Landscape <small>2:1</small></label>
      <input type="radio" name="fmt" id="fmt-square" value="square"><label for="fmt-square">Square <small>1:1</small></label>
    </div>
    <div class="seg" id="winSeg" role="radiogroup" aria-label="Ticker strip shape" hidden>
      <input type="radio" name="win" id="win-1" value="1"><label for="win-1">Strip <small>8:1</small></label>
      <input type="radio" name="win" id="win-2" value="2" checked><label for="win-2">Strip <small>4:1</small></label>
      <input type="radio" name="win" id="win-4" value="4"><label for="win-4">Panel <small>2:1</small></label>
    </div>
  </header>

  <nav class="signs" aria-label="Signs">
    <div class="navh">Kinetic signs</div>
    <ol id="signList"></ol>
    <div class="navh">Zero-frame motion</div>
    <ol id="extraList"></ol>
  </nav>

  <main class="stage">
    <div class="wall"><canvas id="live" width="512" height="1024" aria-label="Animated sign preview"></canvas></div>
    <div class="transport">
      <button class="btn solid" id="play" type="button">Pause</button>
      <output class="clock" id="clock">0.0 / 0.0 s</output>
      <span class="hint" id="stageHint"></span>
    </div>
    <ol class="timeline" id="timeline" aria-label="Frames and hold times"></ol>
    <div class="extras" id="extraCtl" hidden>
      <label class="field"><span id="speedLabel">Seconds per pass</span><input type="number" id="speed" min="2" max="120" step="1" value="20"></label>
    </div>
  </main>

  <aside class="side">
    <section class="p">
      <h2 id="sheetTitle">Spritesheet</h2>
      <div class="sheetbox"><canvas id="sheet" width="300" height="300" aria-label="Spritesheet with grid"></canvas></div>
      <dl class="spec" id="spec"></dl>
      <ul class="checks" id="checks"></ul>
      <div class="exports">
        <button class="btn solid" type="button" id="exPng">Sheet PNG</button>
        <button class="btn" type="button" id="exGif">Preview GIF</button>
        <button class="btn" type="button" id="exLsl">LSL script</button>
        <button class="btn" type="button" id="exCopy">Copy script</button>
        <button class="btn wide" type="button" id="exZip">Everything (.zip)</button>
      </div>
    </section>
    <section class="p">
      <h2>Copy</h2>
      <form class="copy" id="copyForm" autocomplete="off"></form>
      <button class="btn" type="button" id="resetCopy">Reset copy and timing</button>
    </section>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
/* ==========================================================================
   artsy Sign Studio
   Kinetic signs for Second Life, rendered to even spritesheets.
   - Every sign is 8 frames. Every format fills its grid exactly:
       portrait  512x1024 cells, 4x2 grid, 2048x2048 sheet
       landscape 1024x512 cells, 2x4 grid, 2048x2048 sheet
       square    512x512 cells,  4x2 grid, 2048x1024 sheet
     That is 512 px per metre at the suggested prim sizes, with no empty cells.
   - Hold times live in the LSL script, not in repeated frames.
   ========================================================================== */

const FORMATS = {
  portrait:  {id: 'portrait',  name: 'Portrait',  ratio: '1:2', w: 512,  h: 1024, cols: 4, rows: 2, prim: '1 × 2 m'},
  landscape: {id: 'landscape', name: 'Landscape', ratio: '2:1', w: 1024, h: 512,  cols: 2, rows: 4, prim: '2 × 1 m'},
  square:    {id: 'square',    name: 'Square',    ratio: '1:1', w: 512,  h: 512,  cols: 4, rows: 2, prim: '1 × 1 m'},
};
const BLACK = '#000000', WHITE = '#ffffff';

/* ---------- small utilities ---------- */
const R = (x, y, w, h) => ({x, y, w, h});
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function splitRows(r, weights, gap = 0) {
  const tot = weights.reduce((a, b) => a + b, 0), avail = r.h - gap * (weights.length - 1);
  let y = r.y;
  return weights.map(w => { const h = avail * w / tot; const o = R(r.x, y, r.w, h); y += h + gap; return o; });
}
function splitCols(r, weights, gap = 0) {
  const tot = weights.reduce((a, b) => a + b, 0), avail = r.w - gap * (weights.length - 1);
  let x = r.x;
  return weights.map(w => { const ww = avail * w / tot; const o = R(x, r.y, ww, r.h); x += ww + gap; return o; });
}
const gray = v => { const k = Math.round(clamp(v, 0, 1) * 255); return `rgb(${k},${k},${k})`; };
const hex2 = v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0').toUpperCase();

/* ---------- type ---------- */
const STRETCH = [
  ['extra-condensed', 62.5], ['condensed', 75], ['semi-condensed', 87.5],
  ['normal', 100], ['semi-expanded', 112.5], ['expanded', 125],
];
const FACE = {
  display: {family: 'Archivo', fallback: '"Arial Narrow", Arial, sans-serif', weight: 900, style: 'normal', track: -0.012},
  bold:    {family: 'Archivo', fallback: 'Arial, sans-serif', weight: 800, style: 'normal', track: 0},
  mono:    {family: 'Space Mono', fallback: 'ui-monospace, Menlo, monospace', weight: 700, style: 'normal', track: 0.08},
  monoReg: {family: 'Space Mono', fallback: 'ui-monospace, Menlo, monospace', weight: 400, style: 'normal', track: 0.04},
  serif:   {family: 'Instrument Serif', fallback: 'Georgia, serif', weight: 400, style: 'italic', track: -0.01},
};
const HAS_SPACING = 'letterSpacing' in CanvasRenderingContext2D.prototype;
function applyFont(ctx, face, size, stretch = 'normal') {
  ctx.font = `${face.style} ${face.weight} ${size}px "${face.family}", ${face.fallback}`;
  ctx.fontStretch = stretch;
  if (HAS_SPACING) ctx.letterSpacing = (face.track * size).toFixed(2) + 'px';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}
const MEASURES = new Map();
// Ink metrics at 100 px. l/r: ink left/right of the pen position, a/d: ink above/below the baseline.
function measure(ctx, face, stretch, text) {
  const key = `${face.family}|${face.weight}|${face.style}|${stretch}|${face.track}|${text}`;
  let m = MEASURES.get(key);
  if (!m) {
    applyFont(ctx, face, 100, stretch);
    const t = ctx.measureText(text);
    m = {l: t.actualBoundingBoxLeft, r: t.actualBoundingBoxRight, a: t.actualBoundingBoxAscent, d: t.actualBoundingBoxDescent, adv: t.width};
    m.w = m.l + m.r;
    MEASURES.set(key, m);
  }
  return m;

// "RE|DE|LIV|ERY": spaces and | are optional line breaks (| joins without a space), a newline forces one.
function tokenize(text) {
  const out = [];
  let cur = '';
  for (const ch of text) {
    if (ch === ' ' || ch === '|' || ch === '\n') {
      if (cur) { out.push({t: cur, join: ch === '|' ? '' : ch}); cur = ''; }
      else if (ch === '\n' && out.length) out[out.length - 1].join = '\n';

  }
  if (cur) out.push({t: cur, join: null});
  if (out.length) out[out.length - 1].join = null;
  return out;
}
function partitions(tokens, maxLines) {
  const soft = [];
  for (let i = 0; i < tokens.length - 1; i++) if (tokens[i].join !== '\n') soft.push(i);
  const res = [];
  const count = 1 << Math.min(soft.length, 10);
  for (let mask = 0; mask < count; mask++) {
    const brk = new Set();
    soft.forEach((b, j) => { if (mask >> j & 1) brk.add(b); });
    const lines = [];
    let cur = '', midword = 0;
    tokens.forEach((tk, i) => {
      cur += tk.t;
      if (i === tokens.length - 1) { lines.push(cur); return; }
      if (tk.join === '\n' || brk.has(i)) { lines.push(cur); cur = ''; if (tk.join === '') midword++; }
      else cur += tk.join;
    });
    if (lines.length <= maxLines) res.push({lines, midword});
  }
  return res;

      const tr = R(r.x + (i % cols) * (ts + gap), r.y + Math.floor(i / cols) * (ts + gap), ts, ts);
      paintSwatch(ctx, tr, k, i + 3);
      ctx.strokeStyle = this.fg; ctx.lineWidth = lw; ctx.strokeRect(tr.x + lw / 2, tr.y + lw / 2, tr.w - lw, tr.h - lw);

  // title + serif line, optional art beside or above
  statement({dark, tag, title, serif, art, artWeight = 0.42, serifFirst = false, align = 'left'}) {
    this.ground(dark); this.chrome(tag);
    const {u} = this, b = this.body, gap = 3.5 * u;
    let txt = b, artR = null;
    if (art) {
      const parts = this.split(b, this.wide ? [1 - artWeight, artWeight] : [artWeight, 1 - artWeight], 4 * u);
      if (this.wide) [txt, artR] = parts; else [artR, txt] = parts;
    }
    const s = serif ? this.serif(serif, R(0, 0, txt.w, Math.min(txt.h * 0.3, 15 * u)), {max: 15 * u}) : null;
    const tBox = R(txt.x, 0, txt.w, txt.h - (s ? s.h + gap : 0));
    const t = this.text(title, tBox, {mode: 'uniform', lead: 0.14, maxLines: 4});
    const blockH = t.h + (s ? s.h + gap : 0);
    const y0 = txt.y + txt.h - blockH;
    if (serifFirst && s) { s.draw(txt.x, y0, align, txt.w); t.draw(txt.x, y0 + s.h + gap, align, txt.w); }
    else { t.draw(txt.x, y0, align, txt.w); if (s) s.draw(txt.x, y0 + t.h + gap, align, txt.w); }
    if (art) art(artR);
  }
  step({dark, tag, n, title, note, result, icon, art}) {
    this.ground(dark); this.chrome(tag);
    const {u} = this, b = this.body, gap = 3 * u;
    let txt, artR;
    if (this.tall) [artR, txt] = splitRows(b, [0.44, 0.56], 5 * u);
    else [txt, artR] = splitCols(b, this.wide ? [0.56, 0.44] : [0.56, 0.44], 4 * u);
    const chip = this.chip(`Step ${n}`);
    const st = this.status(result, R(0, 0, txt.w, this.tall ? 11 * u : 9 * u), icon);
    const no = this.serif(note, R(0, 0, txt.w, 9 * u), {max: this.tall ? 9 * u : 7.5 * u});
    const tH = txt.h - chip.h - no.h - st.h - gap * 3.4;
    const t = this.text(title, R(txt.x, 0, txt.w, tH), {mode: 'uniform', lead: 0.12, maxLines: 4});
    chip.draw(txt.x, txt.y);
    t.draw(txt.x, txt.y + chip.h + gap * 1.2);
    no.draw(txt.x, txt.y + chip.h + gap * 2.2 + t.h);
    st.draw(txt.x, txt.y + txt.h - st.h);

  }
  signoff({dark, tag, a, b: script}) {
    this.ground(dark); this.chrome(tag);
    const {u} = this, b = this.body;
    if (this.wide) {
      const [l, r] = splitCols(b, [0.58, 0.42], 2 * u);
      const t = this.text(a, l, {mode: 'uniform', maxLines: 1});
      t.draw(l.x, b.y + b.h - t.h);
      const s = this.serif(script, R(0, 0, r.w, b.h));
      s.draw(r.x, b.y + b.h - s.h, 'right', r.w);
    } else {
      const t = this.text(a, R(b.x, b.y, b.w, b.h * (this.tall ? 0.34 : 0.4)), {mode: 'uniform', maxLines: 1});
      t.draw(b.x, b.y);
      const s = this.serif(script, R(0, 0, b.w * 0.92, b.h - t.h - 4 * u));
      s.draw(b.x, b.y + b.h - s.h, 'right', b.w);

  wayfind({dark, tag, q, a, dir}) {
    this.ground(dark); this.chrome(tag);
    const {u} = this, b = this.body, gap = 3 * u;
    const vertical = dir === 'down' || dir === 'up';
    let txt, ar;
    if (this.wide) [txt, ar] = splitCols(b, [0.62, 0.38], 5 * u);
    else if (vertical) [txt, ar] = splitRows(b, [0.58, 0.42], 4 * u);
    else [txt, ar] = splitRows(b, [0.62, 0.38], 4 * u);
    const s = this.serif(q, R(0, 0, txt.w, 10 * u), {max: this.tall ? 10 * u : 8.5 * u});
    const t = this.text(a, R(txt.x, 0, txt.w, txt.h - s.h - gap), {mode: 'uniform', lead: 0.12, maxLines: 4});
    s.draw(txt.x, txt.y);
    t.draw(txt.x, txt.y + s.h + gap);

    let arR;
    if (vertical) { const w = Math.min(ar.w, ar.h * 0.8); arR = R(ar.x + (this.wide ? (ar.w - w) / 2 : 0), ar.y, w, ar.h); }
    else { const h = Math.min(ar.h, ar.w * 0.7); arR = R(ar.x, ar.y + (ar.h - h) / 2, ar.w, h); }
    this.arrow(arR, dir, {lw: Math.max(6, Math.min(arR.w, arR.h) * (vertical ? 0.17 : 0.2))});
  }
  swatch({dark, tag, name, kind, i, n, seed}) {
    this.ground(dark); this.chrome(tag);
    const {ctx, u} = this, b = this.body;

    const lw = Math.max(2, 0.35 * u);
    ctx.strokeStyle = this.fg; ctx.lineWidth = lw; ctx.strokeRect(b.x + lw / 2, b.y + lw / 2, b.w - lw, b.h - lw);
    const c = this.chip(`${String(i).padStart(2, '0')} / ${String(n).padStart(2, '0')}`);
    c.draw(b.x + b.w - c.w, b.y);
    const pad = 2.6 * u;
    const box = R(0, 0, (this.wide ? b.w * 0.62 : b.w) - 2 * pad, (this.tall ? b.h * 0.3 : b.h * 0.42) - 2 * pad);
    const t = this.text(name, box, {mode: 'uniform', lead: 0.1, maxLines: 3});
    const lx = b.x, ly = b.y + b.h - t.h - 2 * pad;
    ctx.fillStyle = this.bg; ctx.fillRect(lx, ly, t.w + 2 * pad, t.h + 2 * pad);
    t.draw(lx + pad, ly + pad);
  }
  cta({dark, tag, serif, title, button, cursor = true, swatches}) {
    this.ground(dark); this.chrome(tag);
    const {u} = this, b = this.body, gap = 3.6 * u;
    const s = this.serif(serif, R(0, 0, b.w, this.tall ? 13 * u : 10 * u), {max: this.tall ? 13 * u : 10 * u});
    const bt = this.button(button, R(0, 0, this.wide ? b.w * 0.6 : b.w, 0), {textH: this.tall ? 5 * u : 4.4 * u});
    const t = this.text(title, R(b.x, 0, b.w, b.h - s.h - bt.h - gap * 2.6), {mode: 'uniform', lead: 0.1, maxLines: 4});
    s.draw(b.x, b.y);
    t.draw(b.x, b.y + s.h + gap);

  }
  // two option cards, one active, like a pricing table
  cards({dark, tag, title, cards, active}) {
    this.ground(dark); this.chrome(tag);
    const {ctx, u} = this, b = this.body, gap = 3 * u;
    const head = this.text(title, R(b.x, 0, b.w, this.tall ? 9 * u : 7 * u), {mode: 'uniform', maxLines: 1});
    head.draw(b.x, b.y);
    const area = R(b.x, b.y + head.h + gap * 1.4, b.w, b.h - head.h - gap * 1.4);
    const boxes = this.split(area, [1, 1], 3 * u, this.o !== 'portrait');
    const lw = Math.max(2, 0.4 * u);
    boxes.forEach((r, i) => {
      const on = i === active, c = cards[i];
      const fg = on ? this.bg : this.fg;
      if (on) { ctx.fillStyle = this.fg; ctx.fillRect(r.x, r.y, r.w, r.h); }
      else { ctx.strokeStyle = this.dim; ctx.lineWidth = lw; ctx.strokeRect(r.x + lw / 2, r.y + lw / 2, r.w - lw, r.h - lw); }
      const pad = 3 * u, inner = R(r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
      const lab = on ? 'Selected' : `Option ${i + 1}`;
      this.mono(lab, inner.x, inner.y, {size: 2.5 * u, valign: 'top', color: on ? this.bg : this.soft});
      const p = this.para(c.note, R(0, 0, inner.w, inner.h * 0.42), {max: this.tall ? 7.5 * u : 6 * u, color: on ? this.bg : this.soft});
      const t = this.text(c.title, R(inner.x, 0, inner.w, inner.h - p.h - 7.5 * u), {mode: 'uniform', lead: 0.1, maxLines: 2, color: fg});
      t.draw(inner.x, inner.y + 5 * u);
      p.draw(inner.x, inner.y + inner.h - p.h);
    });
  }
  stepper({dark, tag, title, steps, active}) {
    this.ground(dark); this.chrome(tag);
    const {ctx, u} = this, b = this.body, gap = 2.4 * u;
    const head = this.text(title, R(b.x, 0, b.w, this.tall ? 8 * u : 6.5 * u), {mode: 'uniform', maxLines: 1});
    head.draw(b.x, b.y);

    const boxes = this.wide ? splitCols(area, weights, gap) : splitRows(area, weights, gap);

      const pad = 2.6 * u, inner = R(r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);

      const tb = R(inner.x, 0, inner.w, inner.h - 5 * u);
      const t = this.text(steps[i], tb, {mode: 'uniform', lead: 0.14, maxLines: on ? 4 : 3, maxSize: on ? undefined : 14 * u, color: on ? this.bg : this.soft});

/* ---------- timing ---------- */

    let total = step, b = a;
    while (b + 1 < holds.length) {

      if (next > step && next >= QUICK) { b++; total += next; }

    runs.push({first: a, count: b - a + 1, rate: 1 / step, seconds: total});

/* ---------- checks ---------- */

// Sheet: ${name}
//        ${fmt.w * fmt.cols} x ${fmt.h * fmt.rows} px, ${fmt.cols} x ${fmt.rows} grid, ${fmt.cols * fmt.rows} frames of ${fmt.w} x ${fmt.h}
// Loop:  ${fmtSec(total)} s in ${runs.length} runs
//
// 1. Put the spritesheet on the display face: Full Bright on, Glow 0, Alpha mode None.
//    Repeats and offsets don't matter; the animation sets them.
// 2. Drop this script into the same prim. It starts on its own.

integer COLS = ${fmt.cols};

${rows}
];

list runs;      // first frame, frame count, frames per second, seconds

build()
{
    runs = [];
    integer n = llGetListLength(TIMELINE) / 2;

        float step = llList2Float(TIMELINE, a * 2 + 1);

const EXTRAS = [

    id: 'ticker', name: 'Ticker strip', kind: 'ticker', size: [2048, 256],
    fields: [field('items', 'Ticker lines', 'Redelivery: click twice / Free sample materials / Tint any material / Full perm or copy-mod / Tutorials on YouTube', 'Separate lines with /')],
    seconds: 24,

  {
    id: 'badge', name: 'Spinning badge', kind: 'badge', size: [512, 512],
    fields: [field('ring', 'Ring text', 'Free samples'), field('times', 'Repeats', '3', null, ['2', '3', '4'])],

Files

  ${sheetName(sign, fmt)}.lsl   player script

  const ok = /\.(gif|png|txt|zip|json|md)$/i.test(name);
  try {
    await dl.save({filename: ok ? name : name + '.txt', data: blob});
    toast('Saved ' + (ok ? name : name + '.txt'));
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'One save at a time. Try again in a moment.' : 'That file could not be saved here.');
  }
}
function scriptText() {
  if (current.kind === 'sign') return lslPlayer(current.sign, current.fmt, current.holds);
  if (current.kind === 'ticker') return lslTicker(state.win, current.seconds);
  return lslBadge(current.seconds);
}
function baseName() {
  if (current.kind === 'sign') return sheetName(current.sign, current.fmt);
  return current.kind === 'ticker' ? 'artsy-ticker-2048x256' : 'artsy-badge-512';
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } finally { btn.disabled = false; }
}

function wire() {
  document.querySelectorAll('input[name=fmt]').forEach(r => {
    r.checked = r.value === state.fmt;
    r.addEventListener('change', () => { state.fmt = r.value; save(); rebuild(false); });
  });
  document.querySelectorAll('input[name=win]').forEach(r => {
    r.checked = Number(r.value) === state.win;
    r.addEventListener('change', () => { state.win = Number(r.value); save(); rebuild(false); });
  });
  $('play').addEventListener('click', () => { state.playing = !state.playing; setPlayLabel(); });
  $('speed').addEventListener('change', () => {
    const v = clamp(parseFloat($('speed').value) || current.sign.seconds, 2, 120);
    state.seconds[current.sign.id] = v; save(); rebuild(false);
  });
  $('exPng').addEventListener('click', e => busy(e.currentTarget, async () => {
    const tex = current.kind === 'sign' ? current.sheet : current.tex;
    await saveFile(baseName() + '.png', await encodePNG(tex, current.kind === 'badge'), 'image/png');
  }));
  $('exGif').addEventListener('click', e => busy(e.currentTarget, async () => {
    await saveFile(baseName() + '.gif', encodeGIF(current.frames, current.holds), 'image/gif');
  }));
  $('exLsl').addEventListener('click', e => busy(e.currentTarget, () => saveFile(baseName() + '.lsl', scriptText(), 'text/plain')));
  $('exCopy').addEventListener('click', () => {
    const text = scriptText();
    navigator.clipboard.writeText(text).then(() => toast('Script copied'), () => {
      const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); toast('Script copied'); } catch (e) { toast('Copy failed. Use the LSL script button.'); }
      ta.remove();
    });
  });
  $('exZip').addEventListener('click', e => busy(e.currentTarget, async () => {
    if (typeof JSZip === 'undefined') { toast('The zip library did not load. Save files one at a time.'); return; }
    const zip = new JSZip(), base = baseName();
    if (current.kind === 'sign') {
      zip.file(base + '.png', await encodePNG(current.sheet));
      zip.file(base + '.gif', encodeGIF(current.frames, current.holds));
      zip.file(base + '.lsl', scriptText());
      zip.file('README.txt', setupNotes(current.sign, current.fmt, current.holds));
    } else {
      zip.file(base + '.png', await encodePNG(current.tex, current.kind === 'badge'));
      zip.file(base + '.lsl', scriptText());
    }
    await saveFile(base + '.zip', await zip.generateAsync({type: 'blob'}), 'application/zip');
  }));
  $('resetCopy').addEventListener('click', () => {
    delete state.copy[state.sel]; delete state.holds[state.sel]; delete state.seconds[state.sel];
    save(); rebuild(); toast('Copy and timing reset');
  });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (current) drawSheetPreview(current.kind === 'sign' ? current.sheet : current.tex, current.kind === 'sign' ? current.fmt.cols : 0, current.kind === 'sign' ? current.fmt.rows : 0); }, 150); });
}

(async function start() {
  $('brandLogo').src = LOGO_PNG;
  const ok = await READY;
  if (!ok) toast('Fonts did not load, so previews use fallbacks. Exports need the real fonts.');
  buildNav();
  wire();
  setPlayLabel();
  rebuild();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
